appId: dev.cjones.chimera
productName: Chimera
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!node_modules/**/{test,tests,__tests__,docs,example,examples}/**'
extraResources:
  - from: resources/connectors.json
    to: connectors.json
# The Agent SDK's bundled CLI must be spawnable — keep it out of asar.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/**
linux:
  target:
    - AppImage
    - rpm
  category: Utility
npmRebuild: false
